<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>10d-game</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
                background: #181818;
                color: #eeeeee;
            }

            * {
                box-sizing: border-box;
            }

            [hidden] {
                display: none !important;
            }

            body {
                margin: 0;
            }

            .github-ribbon {
                position: fixed;
                z-index: 10;
                top: 34px;
                right: -58px;
                width: 220px;
                padding: 9px 0;
                transform: rotate(45deg);
                background: #2d333b;
                box-shadow: 0 2px 8px #00000099;
                color: #ffffff;
                font-size: 0.85rem;
                font-weight: 600;
                text-align: center;
                text-decoration: none;
            }

            .github-ribbon:hover,
            .github-ribbon:focus-visible {
                background: #444c56;
            }

            .github-ribbon:focus-visible {
                outline: 2px solid #ffffff;
                outline-offset: 2px;
            }

            main {
                --fov-max-size: 600px;
                width: min(calc(var(--fov-max-size) + 372px), 100%);
                margin: 0 auto;
                padding: 24px;
            }

            h1,
            h2 {
                margin-top: 0;
            }

            h1 {
                margin-bottom: 8px;
            }

            .muted {
                color: #aaaaaa;
            }

            #game {
                display: grid;
                grid-template-columns: var(--fov-max-size) 300px;
                gap: 24px;
                align-items: start;
                margin-top: 24px;
            }

            #fov {
                display: block;
                width: min(100%, var(--fov-max-size));
                height: auto;
                border: 1px solid #444444;
                image-rendering: pixelated;
            }

            aside {
                width: 300px;
                max-width: 100%;
                padding: 20px;
                border-radius: 8px;
                background: #242424;
            }

            #reward {
                font-size: 1.2rem;
                font-variant-numeric: tabular-nums;
            }

            .resource {
                margin: 20px 0;
            }

            .resource-label {
                display: flex;
                justify-content: space-between;
                margin-bottom: 6px;
            }

            .bar {
                position: relative;
                height: 18px;
                overflow: hidden;
                border: 1px solid #777777;
                background: #444444;
            }

            .bar::after {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 50%;
                width: 1px;
                content: "";
                background: #aaaaaa;
            }

            .bar-fill {
                height: 100%;
                transition: width 80ms linear;
            }

            #satiety-fill {
                background: #66bb6a;
            }

            #hydration-fill {
                background: #42a5f5;
            }

            #inventory {
                display: flex;
                gap: 10px;
                align-items: center;
                margin: 22px 0;
            }

            #inventory-dot {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #555555;
            }

            #inventory-dot.full {
                background: #66bb6a;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 3px 0;
                text-align: left;
            }

            th {
                width: 45%;
                color: #eeeeee;
                font-weight: 600;
            }

            td {
                color: #aaaaaa;
            }

            #game.stacked {
                grid-template-columns: minmax(0, 1fr);
            }

            #game.stacked aside {
                width: min(100%, var(--fov-max-size));
            }
        </style>
    </head>
    <body>
        <a
            class="github-ribbon"
            href="https://github.com/fractal-brain-ai/10d-game"
            target="_blank"
            rel="noopener noreferrer"
        >
            Fork us on GitHub
        </a>

        <main>
            <header id="game-header" hidden>
                <h1>10d-game</h1>
                <div id="game-meta" class="muted">Seed – · Tick –</div>
            </header>

            <section id="game" hidden>
                <canvas
                    id="fov"
                    width="600"
                    height="600"
                    aria-label="Agent field of view"
                ></canvas>

                <aside id="status-panel">
                    <h2>Status</h2>
                    <div id="reward">Reward: 0.00</div>

                    <div class="resource">
                        <div class="resource-label">
                            <span>Satiety</span>
                            <span id="satiety-value">100.0</span>
                        </div>
                        <div
                            id="satiety-bar"
                            class="bar"
                            role="meter"
                            aria-label="Satiety"
                            aria-valuemin="-100"
                            aria-valuemax="100"
                        >
                            <div id="satiety-fill" class="bar-fill"></div>
                        </div>
                    </div>

                    <div class="resource">
                        <div class="resource-label">
                            <span>Hydration</span>
                            <span id="hydration-value">100.0</span>
                        </div>
                        <div
                            id="hydration-bar"
                            class="bar"
                            role="meter"
                            aria-label="Hydration"
                            aria-valuemin="-100"
                            aria-valuemax="100"
                        >
                            <div id="hydration-fill" class="bar-fill"></div>
                        </div>
                    </div>

                    <div id="inventory">
                        <span id="inventory-dot" aria-hidden="true"></span>
                        <span id="inventory-text">Inventory empty</span>
                    </div>

                    <h2>Actions</h2>
                    <table>
                        <tbody>
                            <tr>
                                <th>W / ↑</th>
                                <td>Move north</td>
                            </tr>
                            <tr>
                                <th>A / ←</th>
                                <td>Move west</td>
                            </tr>
                            <tr>
                                <th>S / ↓</th>
                                <td>Move south</td>
                            </tr>
                            <tr>
                                <th>D / →</th>
                                <td>Move east</td>
                            </tr>
                            <tr>
                                <th>E</th>
                                <td>Eat bean</td>
                            </tr>
                            <tr>
                                <th>F</th>
                                <td>Pick up bean</td>
                            </tr>
                            <tr>
                                <th>R</th>
                                <td>Drop bean</td>
                            </tr>
                            <tr>
                                <th>Space</th>
                                <td>Wait</td>
                            </tr>
                            <tr>
                                <th>Q / Esc</th>
                                <td>End game</td>
                            </tr>
                        </tbody>
                    </table>
                </aside>
            </section>
        </main>

        <script id="wasm-bytes" type="application/wasm">@WASM_BASE64@</script>

            const rewardFormatter = new Intl.NumberFormat("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
                notation: "standard",
                useGrouping: true,
            });

            const gameView = document.querySelector("#game");
            const gameHeader = document.querySelector("#game-header");
            const app = document.querySelector("main");
            const statusPanel = document.querySelector("#status-panel");
            const gameMeta = document.querySelector("#game-meta");
            const canvas = document.querySelector("#fov");
            const context = canvas.getContext("2d");
            const rewardElement = document.querySelector("#reward");
            const inventoryDot = document.querySelector("#inventory-dot");
            const inventoryText = document.querySelector("#inventory-text");

            let engine = null;
            let game = 0;
            let seed = 0;
            let tick = 0;
            let cumulativeReward = 0;
            let fovSize = 0;
            let twoColumnWidth = 0;
            const heldKeys = new Map();

            function normalizedKey(event) {
                return event.key.length === 1
                    ? event.key.toLowerCase()
                    : event.key;
            }

            function parseSeed(value) {
                if (value.trim() === "") {
                    return null;
                }
                const parsed = Number(value);
                return Number.isInteger(parsed) &&
                    parsed >= 0 &&
                    parsed <= UINT32_MAX
                    ? parsed
                    : null;
            }

            function seedFromUrl() {
                const url = new URL(window.location.href);
                const parameter = url.searchParams.get("seed");
                if (parameter !== null) {
                    const urlSeed = parseSeed(parameter);
                    if (urlSeed === null) {
                        throw new Error(
                            "The URL seed must be an integer from 0 to 4,294,967,295.",
                        );
                    }
                    return urlSeed;
                }

                const randomSeed = crypto.getRandomValues(new Uint32Array(1))[0];
                url.searchParams.set("seed", String(randomSeed));
                history.replaceState(null, "", url);
                return randomSeed;
            }

            function clearHeldKey(key) {
                const held = heldKeys.get(key);
                if (held === undefined) {
                    return;
                }
                clearTimeout(held.timeout);
                clearInterval(held.interval);
                heldKeys.delete(key);
            }

            function clearHeldKeys() {
                for (const key of heldKeys.keys()) {
                    clearHeldKey(key);
                }
            }

            function updateBar(name, value) {
                const fraction = Math.min(1, Math.max(0, (value + 100) / 200));
                document.querySelector(`#${name}-value`).textContent =
                    value.toFixed(1);
                document.querySelector(`#${name}-fill`).style.width =
                    `${fraction * 100}%`;
                document
                    .querySelector(`#${name}-bar`)
                    .setAttribute("aria-valuenow", value);
            }

            function updateLayout() {
                if (twoColumnWidth === 0) {
                    return;
                }

                const appStyle = getComputedStyle(app);
                const availableWidth =
                    app.clientWidth -
                    Number.parseFloat(appStyle.paddingLeft) -
                    Number.parseFloat(appStyle.paddingRight);
                gameView.classList.toggle(
                    "stacked",
                    availableWidth < twoColumnWidth,
                );
            }

            function matchFovToStatusPanel() {
                gameView.classList.remove("stacked");
                const panelBounds = statusPanel.getBoundingClientRect();
                const gap = Number.parseFloat(
                    getComputedStyle(gameView).columnGap,
                );
                const fovMaxSize = panelBounds.height;
                twoColumnWidth = fovMaxSize + panelBounds.width + gap;
                app.style.setProperty("--fov-max-size", `${fovMaxSize}px`);
                updateLayout();
            }

            function setFillColor(color) {
                context.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
            }

            function drawFov() {
                const pixelCount = fovSize * fovSize;
                const redPointer = engine.xdgame_get_fov_r(game) >>> 0;
                const greenPointer = engine.xdgame_get_fov_g(game) >>> 0;
                const bluePointer = engine.xdgame_get_fov_b(game) >>> 0;
                const red = new Uint8Array(
                    engine.memory.buffer,
                    redPointer,
                    pixelCount,
                );
                const green = new Uint8Array(
                    engine.memory.buffer,
                    greenPointer,
                    pixelCount,
                );
                const blue = new Uint8Array(
                    engine.memory.buffer,
                    bluePointer,
                    pixelCount,
                );

                context.clearRect(0, 0, canvas.width, canvas.height);

                for (let screenY = 0; screenY < fovSize; screenY += 1) {
                    const sourceY = fovSize - screenY - 1;
                    const top = Math.floor(
                        (screenY * canvas.height) / fovSize,
                    );
                    const bottom = Math.floor(
                        ((screenY + 1) * canvas.height) / fovSize,
                    );
                    for (let x = 0; x < fovSize; x += 1) {
                        const source = sourceY * fovSize + x;
                        const left = Math.floor((x * canvas.width) / fovSize);
                        const right = Math.floor(
                            ((x + 1) * canvas.width) / fovSize,
                        );
                        if (red[source] === 0 && green[source] === 0) {
                            const illumination = blue[source];
                            context.fillStyle = `rgb(${illumination}, ${illumination}, ${illumination})`;
                            context.fillRect(
                                left,
                                top,
                                right - left,
                                bottom - top,
                            );
                        } else {
                            setFillColor(PLASMA[red[source]]);
                            context.fillRect(
                                left,
                                top,
                                right - left,
                                bottom - top,
                            );

                            setFillColor(PLASMA[green[source]]);
                            context.beginPath();
                            context.moveTo(right, top);
                            context.lineTo(right, bottom);
                            context.lineTo(left, bottom);
                            context.closePath();
                            context.fill();
                        }
                    }
                }

                context.lineWidth = CELL_BORDER_WIDTH;
                context.strokeStyle = BEAN_BORDER_COLOR;
                for (let screenY = 0; screenY < fovSize; screenY += 1) {
                    const sourceY = fovSize - screenY - 1;
                    const top = Math.floor(
                        (screenY * canvas.height) / fovSize,
                    );
                    const bottom = Math.floor(
                        ((screenY + 1) * canvas.height) / fovSize,
                    );
                    for (let x = 0; x < fovSize; x += 1) {
                        const source = sourceY * fovSize + x;
                        if (red[source] === 0 && green[source] === 0) {
                            continue;
                        }

                        const left = Math.floor((x * canvas.width) / fovSize);
                        const right = Math.floor(
                            ((x + 1) * canvas.width) / fovSize,
                        );
                        context.strokeRect(
                            left + 1,
                            top + 1,
                            right - left - 2,
                            bottom - top - 2,
                        );
                    }
                }

                const cellSize = canvas.width / fovSize;
                const center = Math.floor(fovSize / 2) * cellSize;
                context.strokeStyle = AGENT_BORDER_COLOR;
                context.strokeRect(
                    center + 1,
                    center + 1,
                    cellSize - 2,
                    cellSize - 2,
                );
            }

            function updateState() {
                gameMeta.textContent = `Seed ${seed} · Tick ${tick}`;
                rewardElement.textContent = `Reward: ${rewardFormatter.format(
                    cumulativeReward,
                )}`;
                updateBar("satiety", engine.xdgame_get_satiety_level(game));
                updateBar("hydration", engine.xdgame_get_hydration_level(game));

                const hasBean = engine.xdgame_get_inventory_count(game) !== 0;
                inventoryDot.classList.toggle("full", hasBean);
                inventoryText.textContent = hasBean
                    ? "Bean carried"
                    : "Inventory empty";
                drawFov();
            }

            function performAction(action) {
                if (game === 0) {
                    return;
                }
                cumulativeReward += engine.xdgame_tick(game, action);
                tick += 1;
                updateState();
            }

            function endGame() {
                clearHeldKeys();
                if (game !== 0) {
                    engine.xdgame_free_game(game);
                    game = 0;
                }
                gameView.hidden = true;
                gameMeta.textContent =
                    `Game ended · Seed ${seed} · Tick ${tick} · Reload to restart`;
            }

            function startGame(requestedSeed) {
                let config = engine.xdgame_default_config();
                if (config === 0) {
                    throw new Error(
                        "Could not allocate the default configuration.",
                    );
                }

                try {
                    game = engine.xdgame_new_game(requestedSeed, config);
                } finally {
                    engine.xdgame_free_config(config);
                }

                if (game === 0) {
                    throw new Error("Could not create the game.");
                }

                seed = requestedSeed;
                tick = 0;
                cumulativeReward = 0;
                fovSize = engine.xdgame_fov_size();

                gameHeader.hidden = false;
                gameView.hidden = false;
                matchFovToStatusPanel();
                updateState();
                canvas.focus();
            }

            function beginRepeat(key, action) {
                const held = { timeout: 0, interval: 0 };
                held.timeout = setTimeout(() => {
                    performAction(action);
                    held.interval = setInterval(
                        () => performAction(action),
                        REPEAT_INTERVAL_MS,
                    );
                }, REPEAT_DELAY_MS);
                heldKeys.set(key, held);
            }

            document.addEventListener("keydown", (event) => {
                if (
                    game === 0 ||
                    event.ctrlKey ||
                    event.metaKey ||
                    event.altKey
                ) {
                    return;
                }

                const key = normalizedKey(event);
                if (key === "Escape" || key === "q") {
                    event.preventDefault();
                    endGame();
                    return;
                }

                const action = KEY_ACTIONS.get(key);
                if (action === undefined) {
                    return;
                }

                event.preventDefault();
                if (event.repeat || heldKeys.has(key)) {
                    return;
                }

                performAction(action);
                if (REPEATABLE_KEYS.has(key)) {
                    beginRepeat(key, action);
                }
            });

            document.addEventListener("keyup", (event) =>
                clearHeldKey(normalizedKey(event)),
            );
            window.addEventListener("blur", clearHeldKeys);
            window.addEventListener("resize", updateLayout);
            window.addEventListener("beforeunload", () => {
                if (game !== 0) {
                    engine.xdgame_free_game(game);
                }
            });

            async function initialize() {
                try {
                    const requestedSeed = seedFromUrl();
                    const base64 = document
                        .querySelector("#wasm-bytes")
                        .textContent.trim();
                    const binary = atob(base64);
                    const bytes = Uint8Array.from(binary, (character) =>
                        character.charCodeAt(0),
                    );
                    const result = await WebAssembly.instantiate(bytes, {});
                    engine = result.instance.exports;
                    engine._initialize();
                    startGame(requestedSeed);
                } catch (error) {
                    gameHeader.hidden = false;
                    gameMeta.textContent = `Could not start the game: ${error}`;
                }
            }

            initialize();
        </script>
    </body>
</html>
