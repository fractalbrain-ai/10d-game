name: Check

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    c-checks:
        name: C checks
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Install Clang tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes clang-format clang-tidy

            - name: Check C sources
              run: make check

    python-tests:
        name: Python tests
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: bindings/python/uv.lock

            - name: Install Emscripten
              run: |
                  ./3rd-party/emsdk/emsdk install latest
                  ./3rd-party/emsdk/emsdk activate latest

            - name: Build WebAssembly module
              run: make wasm

            - name: Install Python dependencies
              working-directory: bindings/python
              run: uv sync --frozen --group dev

            - name: Run Python tests
              working-directory: bindings/python
              run: uv run --frozen --group dev pytest
