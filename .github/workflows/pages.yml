name: Documentation

on:
    push:
        tags:
            - "v*"

permissions:
    actions: read
    contents: read
    id-token: write
    pages: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        name: Build Pages site
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5
              with:
                  submodules: recursive

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: bindings/python/uv.lock

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes doxygen
                  ./3rd-party/emsdk/emsdk install latest
                  ./3rd-party/emsdk/emsdk activate latest

            - name: Build browser landing page
              run: |
                  make html
                  mkdir -p build/pages
                  cp build/10d_game.html build/pages/index.html

            - name: Build C API documentation
              run: |
                  make -C docs html
                  cp -R docs/build/html build/pages/c-api

            - name: Build Python documentation
              working-directory: bindings/python
              run: |
                  uv sync --frozen --group docs
                  uv run --frozen --group docs sphinx-build \
                      -W -b html docs docs/_build/html
                  cp -R docs/_build/html ../../build/pages/python

            - name: Disable Jekyll processing
              run: touch build/pages/.nojekyll

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: build/pages

    deploy:
        name: Deploy GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
